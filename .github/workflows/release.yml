name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Version prüfen
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/smartphone_dashboard/manifest.json").read_text()
          )
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if manifest["version"] != tag:
              raise SystemExit(
                  f"Tag {tag} stimmt nicht mit Manifest {manifest['version']} überein"
              )
      - name: HACS-Paket bauen
        working-directory: custom_components/smartphone_dashboard
        run: >-
          zip -r "${GITHUB_WORKSPACE}/smartphone_dashboard.zip" .
          -x '*/__pycache__/*' '*.pyc'
      - name: HACS-Paket prüfen
        run: |
          unzip -t smartphone_dashboard.zip
          unzip -Z1 smartphone_dashboard.zip | grep -Fxq 'manifest.json'
          unzip -Z1 smartphone_dashboard.zip | grep -Fxq 'frontend/smartphone-dashboard-loader.js'
      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          smartphone_dashboard.zip
          --verify-tag
          --title "Smartphone Dashboard ${GITHUB_REF_NAME}"
          --generate-notes
